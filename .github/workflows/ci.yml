name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the bundle is only built and inspected here, never deployed.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (production)
        run: pnpm build
      - name: CSP check
        run: pnpm check:csp
      - name: Unit tests
        run: pnpm test:ci

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest
      # `supabase start` applies every migration + seed.sql from scratch on a
      # fresh database and fails if any file errors, so a broken migration is
      # caught before it can reach main.
      - name: Apply all migrations to a fresh local database
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
