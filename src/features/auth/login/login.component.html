<div class="min-h-screen flex items-center justify-center bg-neutral-950 px-4">
  <div class="w-full max-w-sm space-y-6">

    <div class="text-center flex items-center flex-col">
      <app-icon name="shield-slash" iconClass="w-24 h-24 flex items-center" />
      <h1 class="text-3xl font-bold tracking-tight text-neutral-100">The Gym Club</h1>
      <h2 class="text-1xl font-bold tracking-tight text-neutral-100">Project*</h2>
      <p class="mt-1 text-sm text-neutral-400">Sign in to your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="space-y-1">
        <label for="email" class="block text-sm font-medium text-neutral-300">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" [ngModel]="email()"
          (ngModelChange)="email.set($event)" class="w-full rounded-md border border-neutral-700 bg-neutral-900 px-3 py-2 text-sm
                 text-neutral-100 placeholder-neutral-500 focus:border-[hsl(var(--tenant-primary))]
                 focus:outline-none focus:ring-1 focus:ring-[hsl(var(--tenant-primary))]"
          placeholder="you@example.com" />
      </div>

      <div class="space-y-1">
        <label for="password" class="block text-sm font-medium text-neutral-300">Password</label>
        <div class="relative">
          <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'" required autocomplete="current-password"
            [ngModel]="password()" (ngModelChange)="password.set($event)"
            class="w-full rounded-md border border-neutral-700 bg-neutral-900 px-3 py-2 pr-10 text-sm
                   text-neutral-100 placeholder-neutral-500 focus:border-[hsl(var(--tenant-primary))]
                   focus:outline-none focus:ring-1 focus:ring-[hsl(var(--tenant-primary))]"
            placeholder="••••••••" />
          <button type="button" (click)="showPassword.set(!showPassword())"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-neutral-500 hover:text-neutral-300 transition-colors">
            <app-icon [name]="showPassword() ? 'eye-slash' : 'eye'" iconClass="w-4 h-4" />
          </button>
        </div>
      </div>

      @if (error()) {
      <p class="rounded-md bg-red-950 px-3 py-2 text-sm text-red-300">{{ error() }}</p>
      }

      <button type="submit" [disabled]="submitting()" class="w-full rounded-md bg-[hsl(var(--tenant-primary))] px-4 py-2 text-sm font-semibold
               text-[hsl(var(--tenant-contrast))] transition-colors
               hover:bg-[hsl(var(--tenant-hover))] disabled:opacity-50 disabled:cursor-not-allowed">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

  </div>
</div>
