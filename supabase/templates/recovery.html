<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;color:#e5e5e5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background:#171717;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 8px;font-size:22px;color:#f5f5f5;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#a3a3a3;">
                  We received a request to reset the password for your The Gym Club Project account.
                  Press the button below to choose a new one.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
                     style="display:inline-block;padding:12px 24px;background:#ef4444;color:#ffffff;
                            text-decoration:none;font-weight:bold;font-size:15px;border-radius:8px;">
                    Reset password
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#737373;">
                  This link can only be used once and expires soon. If you didn't ask for this,
                  you can ignore this email: your password won't change.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
